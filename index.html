<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Stuffsy – Free Online Tools for Everyday Use</title>
    <meta name="description" content="Stuffsy is a free collection of useful online tools — cloud file storage, URL shortener, and more. No signup required. Fast, simple, and always accessible." />
    <meta name="keywords" content="online tools, url shortener, cloud storage, free tools, file upload, link shortener" />
    <link rel="canonical" href="https://stuffsy.site/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stuffsy.site/" />
    <meta property="og:title" content="Stuffsy – Free Online Tools for Everyday Use" />
    <meta property="og:description" content="A free collection of useful online tools — cloud file storage, URL shortener, and more. No signup required." />
    <meta property="og:site_name" content="Stuffsy" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Stuffsy – Free Online Tools for Everyday Use" />
    <meta name="twitter:description" content="A free collection of useful online tools — cloud file storage, URL shortener, and more. No signup required." />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- JSON-LD: WebSite structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Stuffsy",
      "url": "https://stuffsy.site/",
      "description": "A free collection of useful online tools — cloud file storage, URL shortener, and more.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://stuffsy.site/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
